# Optional Nginx alternative to the Python/systemd static server.
# Install on jobpi:
#   sudo tee /etc/nginx/sites-available/mars-colony-manager < deploy/nginx-mars-colony-manager.conf
#   sudo ln -sf /etc/nginx/sites-available/mars-colony-manager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then point Cloudflare at http://localhost:8018 (same port).
#
# Prefer the systemd unit in normal deploys; this file is for hosts that
# already centralize static sites on Nginx.

server {
    listen 127.0.0.1:8018;
    server_name localhost;
    root /home/jcube/projects/mars-colony-manager/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
